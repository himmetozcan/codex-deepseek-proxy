[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-deepseek-proxy"
version = "0.1.0"
description = "Local Responses API compatibility proxy for using DeepSeek models with Codex."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Codex DeepSeek Proxy Contributors" }
]
keywords = ["codex", "deepseek", "responses-api", "chat-completions", "proxy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
]
dependencies = []

[project.scripts]
codex-deepseek-proxy = "codex_deepseek_proxy.proxy:main"

[tool.setuptools.packages.find]
include = ["codex_deepseek_proxy*"]
